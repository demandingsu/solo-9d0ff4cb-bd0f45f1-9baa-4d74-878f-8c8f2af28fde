services:
  api:
    build: .
    container_name: tender-collector-api
    environment:
      TENDER_DB_PATH: /data/tenders.db
      TENDER_HTTP_TIMEOUT: "15"
    ports:
      - "8000:8000"
    volumes:
      - tender-data:/data
    restart: unless-stopped

  # 本地分页 HTML 示例公告站（纯静态文件，nginx 托管）
  demo-site:
    image: nginx:1.27-alpine
    container_name: tender-demo-site
    ports:
      - "8001:80"
    volumes:
      - ./demo_site:/usr/share/nginx/html:ro
    restart: unless-stopped

  # 双源核对的第二个公告来源：含截止时间冲突与单边刊载示例
  demo-site-b:
    image: nginx:1.27-alpine
    container_name: tender-demo-site-b
    ports:
      - "8002:80"
    volumes:
      - ./demo_site_b:/usr/share/nginx/html:ro
    restart: unless-stopped

  # 页面故障示例：列表页指向不存在的详情页（HTTP 404）
  demo-site-broken:
    image: nginx:1.27-alpine
    container_name: tender-demo-site-broken
    ports:
      - "8003:80"
    volumes:
      - ./demo_site_broken:/usr/share/nginx/html:ro
    restart: unless-stopped

volumes:
  tender-data:
